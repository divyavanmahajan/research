[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvm-haranalyzer"
version = "0.2.0"
description = "Analyze HAR files and identify page-load bottlenecks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dvm-haranalyzer = "main:main"
har-analyzer = "main:main"

[tool.setuptools]
py-modules = ["main"]
