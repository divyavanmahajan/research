# Key cross-schema relationships
relationships:
  sales_to_finance:
    - "main.sales.orders.order_id → main.finance.invoices.order_id (1:1)"
    - "main.sales.customers.customer_id → main.finance.invoices.customer_id (1:N)"
  sales_to_inventory:
    - "main.sales.products.product_id → main.inventory.stock_levels.product_id (1:N)"
    - "main.sales.orders.order_id → main.inventory.stock_movements.reference_id (1:N, where reference_type='order')"
  sales_to_purchasing:
    - "main.sales.products.product_id → main.purchasing.purchase_order_items.product_id (1:N)"
    - "main.sales.products.supplier_id → main.purchasing.suppliers.supplier_id (N:1)"
  inventory_to_purchasing:
    - "main.inventory.warehouses.warehouse_id → main.purchasing.purchase_orders.warehouse_id (1:N)"
