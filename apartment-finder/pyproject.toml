[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmv-aptfind"
version = "0.1.0"
description = "Personal apartment search tool for Swedish listings (Qasa)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
dmv-aptfind = "dmv_aptfind.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dmv_aptfind"]
artifacts = ["src/dmv_aptfind/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
