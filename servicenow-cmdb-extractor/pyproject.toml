[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sn-cmdb-extractor"
version = "0.1.0"
description = "Extract ServiceNow CMDB structure using a browser session — no API credentials required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["servicenow", "cmdb", "playwright", "sqlite", "extract"]
dependencies = [
    "playwright>=1.44",
    "typer[all]>=0.12",
    "rich>=13",
    "aiosqlite>=0.20",
    "anyio>=4",
    "httpx>=0.27",          # used only for optional direct REST calls
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
sn-cmdb = "sn_cmdb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
