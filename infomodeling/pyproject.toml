[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infomodel-dbt-generator"
version = "0.1.0"
description = "Generate DBT projects from conceptual information model YAML files"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "jinja2>=3.1",
    "faker>=24.0",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
infomodel-dbt = "infomodeling.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
