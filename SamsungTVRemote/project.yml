name: SamsungTVRemote

options:
  bundleIdPrefix: com.samsungremote
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_PREVIEWS: YES
    OTHER_SWIFT_FLAGS: "-package-name SamsungTVRemote"

targets:

  SamsungRemote-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Samsung TV Remote
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Used to discover Samsung TVs on your local network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsungremote.ios
        CODE_SIGN_STYLE: Automatic

  SamsungRemote-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: macOS
      - path: Shared
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Samsung TV Remote
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsungremote.mac
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
